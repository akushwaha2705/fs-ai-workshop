
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">URL Shortener</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Shorten Your URL</h5>
                        <form id="url-form">
                            <div class="mb-3">
                                <label for="longUrl" class="form-label">Long URL</label>
                                <input type="url" class="form-control" id="longUrl" name="longUrl" required>
                            </div>
                            <div class="mb-3">
                                <label for="customCode" class="form-label">Custom Code (Optional)</label>
                                <input type="text" class="form-control" id="customCode" name="customCode">
                            </div>
                            <button type="submit" class="btn btn-primary">Shorten</button>
                        </form>
                    </div>
                </div>

                <div class="mt-4">
                    <h5>Recent URLs</h5>
                    <div class="table-responsive">
                        <table class="table" id="urls-table">
                            <thead>
                                <tr>
                                    <th>Short URL</th>
                                    <th>Original URL</th>
                                    <th>Clicks</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
